
volumes:
  pg-backup-data-dir:
  pg-data-dir:
  minio_data:

services:

  db:
    image: kartoza/postgis:18-3.6
    restart: 'always'
    volumes:
      - ../utils/setup-db.sql:/docker-entrypoint-initdb.d/setup-db.sql
    environment:
      - POSTGRES_DB=gis
      - POSTGRES_USER=docker
      - POSTGRES_PASS=docker
      - ACTIVATE_CRON=False
    healthcheck:
      interval: 60s
      timeout: 30s
      retries: 3
      test: "pg_isready"

  minio:
    image: rustfs/rustfs:latest
    container_name: rustfs_dev
    command: /data
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minio_admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-secure_minio_secret}
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pg_restore:
    image: kartoza/pg-backup:${TAG:-manual-build}
    restart: 'always'
    volumes:
      - pg-backup-data-dir:/backups
      - ./tests:/tests
      - ../utils:/lib/utils
    environment:
      - DUMPPREFIX=PG_gis
      - POSTGRES_HOST=db
      - POSTGRES_USER=docker
      - POSTGRES_PASS=docker
      - POSTGRES_PORT=5432
      - TARGET_DB=data
      - WITH_POSTGIS=1
      - STORAGE_BACKEND=S3
      - ACCESS_KEY_ID=minio_admin
      - SECRET_ACCESS_KEY=secure_minio_secret
      - DEFAULT_REGION=us-west-2
      - BUCKET=backups
      - HOST_BASE=minio:9000
      - HOST_BUCKET=backup
      - SSL_SECURE=False
      - CHECKSUM_VALIDATION=False
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      interval: 60s
      timeout: 30s
      retries: 3
      test: "pg_isready"
